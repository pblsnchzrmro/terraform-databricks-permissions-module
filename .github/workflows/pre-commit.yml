name: Pre-Commit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  precommit-min-version:
    name: Validate with minimum supported version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Terraform version bounds
        id: minmax
        uses: clowdhaus/terraform-min-max@v2.1.0
        with:
          directory: '.'

      - name: Show detected versions
        run: |
          echo "Minimum version: ${{ steps.minmax.outputs.minVersion }}"
          echo "Maximum version: ${{ steps.minmax.outputs.maxVersion }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.minmax.outputs.minVersion }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  precommit-max-version:
    name: Validate with maximum supported version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Detect Terraform version bounds
        id: minmax
        uses: clowdhaus/terraform-min-max@v2.1.0
        with:
          directory: '.'

      - name: Show detected versions
        run: |
          echo "Minimum version: ${{ steps.minmax.outputs.minVersion }}"
          echo "Maximum version: ${{ steps.minmax.outputs.maxVersion }}"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ steps.minmax.outputs.maxVersion }}

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate
